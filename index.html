<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceff2">
<title>SNS 편성표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 편성표: 날짜 = 한 줄, 그 줄 안에 그날 올라갈 글이 실제 게시물처럼 펼쳐져 보인다.
   글을 열 필요 없이 사진·제목·본문 전체를 보고, 카드에서 바로 승인하거나 여러 개를 한 번에 승인한다. */
:root {
  --paper: #eceff2; --surface: #ffffff; --rail: #e1e5ea; --ink: #1a1d21; --muted: #5d6571; --line: #d5dae0; --sunk: #f3f5f7;
  --focus: #2b5bd7; --btn: #1a1d21; --btn-ink: #fff;
  --lantern: #b4235a; --lantern-soft: #fbe8ef;
  --helloaji: #17795a; --helloaji-soft: #e1f3eb;
  --chloe: #3d4f86; --chloe-soft: #e7ebf6;
  --ok: #1d7a3e; --ok-soft: #e3f4e8; --warn: #95560a; --warn-soft: #fdf0d9; --bad: #b3261e; --bad-soft: #fde6e4;
  --f: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14171b; --surface: #1c2026; --rail: #191c21; --ink: #e9ecf0; --muted: #98a1ae; --line: #2c323b; --sunk: #232830;
    --focus: #82a6ff; --btn: #e9ecf0; --btn-ink: #14171b;
    --lantern: #f27aa6; --lantern-soft: #3a1c28; --helloaji: #5fcda1; --helloaji-soft: #163128; --chloe: #a3b3e2; --chloe-soft: #222a3f;
    --ok: #6fd18d; --ok-soft: #16301f; --warn: #f0b85a; --warn-soft: #382b12; --bad: #ff8b82; --bad-soft: #3c1b19;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f); font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- 상단 ---------- */
.top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1680px; margin: 0 auto; padding: 14px 24px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 28px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; }
.brand .range { color: var(--muted); font-weight: 500; }
.seg { display: flex; gap: 2px; background: var(--rail); padding: 3px; border-radius: 10px; width: max-content; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: .88rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button b { font-weight: 700; margin-left: 4px; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.accts { display: flex; gap: 6px; flex-wrap: wrap; }
.acct-f { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 10px; font-size: .86rem; display: inline-flex; align-items: center; gap: 6px; }
.acct-f i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.acct-f[data-a="lantern"] i { background: var(--lantern); }
.acct-f[data-a="helloaji"] i { background: var(--helloaji); }
.acct-f[data-a="chloe"] i { background: var(--chloe); }
.acct-f[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.tools { display: flex; gap: 10px; align-items: center; justify-self: end; flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: .86rem; }

/* 주간 띠: 날짜를 누르면 그 줄로 이동 */
.week { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.wd { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; }
.wd .n { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em; grid-row: span 2; line-height: 1; }
.wd .w { font-size: .76rem; color: var(--muted); line-height: 1.2; }
.wd .c { font-size: .76rem; line-height: 1.2; font-weight: 600; }
.wd .c.done { color: var(--ok); }
.wd .c.todo { color: var(--warn); }
.wd.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---------- 편성표 본문 ---------- */
main { max-width: 1680px; margin: 0 auto; padding: 20px 24px 120px; }
.day { display: grid; grid-template-columns: 112px 1fr; gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); scroll-margin-top: 170px; }
.day:first-child { border-top: 0; padding-top: 0; }
.day-label { position: sticky; top: 182px; align-self: start; display: flex; flex-direction: column; }
.day-label .dnum { font-size: 3.2rem; font-weight: 800; line-height: .95; letter-spacing: -0.05em; }
.day-label .dmeta { font-size: .9rem; color: var(--muted); font-weight: 500; margin-top: 6px; }
.day-label .dsum { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.day-label .tag-today { align-self: flex-start; margin-top: 8px; background: var(--ink); color: var(--paper); font-size: .74rem; font-weight: 700; padding: 1px 8px; border-radius: 5px; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }

/* 게시물 카드: 위쪽 색 띠가 계정, 테두리 상태가 승인 여부 */
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; border-top: 4px solid var(--acc); }
.post.acc-lantern { --acc: var(--lantern); --acc-soft: var(--lantern-soft); }
.post.acc-helloaji { --acc: var(--helloaji); --acc-soft: var(--helloaji-soft); }
.post.acc-chloe { --acc: var(--chloe); --acc-soft: var(--chloe-soft); }
.post.is-selected { box-shadow: 0 0 0 2px var(--focus); border-color: var(--focus); border-top-color: var(--acc); }
.post.st-approved { border-color: var(--ok); border-top-color: var(--acc); }
.post.st-posted, .post.st-rejected { opacity: .62; }
.post.st-failed { border-color: var(--bad); border-top-color: var(--acc); }
.p-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
.p-head .sel { display: flex; align-items: center; }
.p-head .sel input { width: 18px; height: 18px; margin: 0; accent-color: var(--focus); cursor: pointer; }
.p-head .who { font-weight: 700; color: var(--acc); font-size: .9rem; }
.p-head .ch { font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.p-head .ch svg { width: 14px; height: 14px; }
.p-head .slot { margin-left: auto; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 1rem; width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }
.p-head .slot:disabled { opacity: 1; -webkit-text-fill-color: currentColor; }
.p-head .slot:enabled:hover, .p-head .slot:focus { border-color: var(--line); background: var(--sunk); }

/* 사진 */
.media { position: relative; background: var(--sunk); }
.media .main { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.media .strip { display: flex; gap: 6px; padding: 6px; overflow-x: auto; background: var(--sunk); }
.media .th { position: relative; flex: none; width: 52px; height: 52px; border-radius: 6px; overflow: hidden; background: var(--line); }
.media .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .th .x { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: .8rem; line-height: 20px; padding: 0; }
.media .th.add { border: 1.5px dashed var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.3rem; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%; aspect-ratio: 4 / 3; border: 0; background: repeating-linear-gradient(-45deg, var(--sunk) 0 10px, var(--surface) 10px 20px); color: var(--muted); padding: 16px 20px; text-align: center; }
.drop strong { color: var(--ink); font-size: .98rem; }
.drop span { font-size: .82rem; }
.drop em { font-style: normal; font-size: .84rem; margin-top: 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.media.dragging::after { content: "여기에 놓기"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--focus) 18%, transparent); outline: 2px dashed var(--focus); outline-offset: -6px; color: var(--ink); font-weight: 700; }
.media .busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); color: #fff; font-weight: 600; font-size: .9rem; }

/* 글 */
.p-body { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 6px; }
.p-title { margin: 0; font-size: 1.04rem; line-height: 1.4; font-weight: 700; letter-spacing: -0.01em; }
.p-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; line-height: 1.65; color: var(--ink); border-radius: 8px; margin: 0 -6px; padding: 4px 6px; }
.p-text.can-edit { cursor: text; }
.p-text.can-edit:hover { background: var(--sunk); }
.p-text mark { background: var(--warn-soft); color: var(--warn); font-weight: 700; border-radius: 4px; padding: 0 2px; }
.p-edit { width: calc(100% + 12px); margin: 0 -6px; border: 1px solid var(--focus); border-radius: 8px; padding: 4px 6px; background: var(--surface); font-size: .92rem; line-height: 1.65; resize: none; overflow: hidden; display: block; }
.p-note { font-size: .82rem; color: var(--muted); }
.p-err { font-size: .82rem; color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }

.p-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; margin-top: auto; }
.issues { font-size: .8rem; color: var(--warn); font-weight: 600; flex: 1; min-width: 0; }
.okline { font-size: .8rem; color: var(--muted); flex: 1; }
.okline.good { color: var(--ok); font-weight: 600; }
.okline.over { color: var(--bad); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 14px; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.approve { min-width: 76px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.badge { font-size: .8rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
.badge.approved { color: var(--ok); background: var(--ok-soft); }
.badge.posted { color: var(--btn-ink); background: var(--ok); }
.badge.failed { color: var(--bad); background: var(--bad-soft); }
.badge.rejected { color: var(--muted); background: var(--sunk); }
a.link { color: var(--focus); font-weight: 600; font-size: .86rem; }

/* 하단 일괄 승인 바 */
.bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 15; width: min(880px, calc(100% - 32px)); background: var(--btn); color: var(--btn-ink); border-radius: 14px; padding: 10px 10px 10px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(10, 14, 20, .28); }
.bar .msg { flex: 1; font-size: .92rem; min-width: 0; }
.bar .msg b { font-weight: 800; }
.bar .btn { border-color: transparent; }
.bar .btn.light { background: transparent; color: var(--btn-ink); border-color: color-mix(in srgb, var(--btn-ink) 30%, transparent); }
.bar .btn.go { background: var(--btn-ink); color: var(--btn); }

.empty { text-align: center; color: var(--muted); padding: 80px 16px; }
.empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }
.loading { text-align: center; color: var(--muted); padding: 80px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 40; max-width: calc(100% - 32px); }

/* 처음 한 번: 토큰 */
.setup { max-width: 480px; margin: 0 auto; padding: 72px 16px; display: flex; flex-direction: column; gap: 14px; }
.setup h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.03em; }
.setup p { margin: 0; color: var(--muted); }
.setup ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: .92rem; }
.setup input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.setup .btn { padding: 12px; }
.setup .p-err { font-size: .88rem; }

/* 요약 보기: 본문 6줄까지, 사진 낮게. 본문을 누르면 전체가 펼쳐지며 바로 수정 */
.compact .media .main, .compact .drop { aspect-ratio: 16 / 9; }
.compact .drop em span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.compact .p-text { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 900px) {
  .top-in { grid-template-columns: 1fr; padding: 12px 16px; }
  .tools { justify-self: start; }
  .seg { overflow-x: auto; max-width: 100%; }
  .week { display: flex; overflow-x: auto; }
  .wd { flex: none; }
  main { padding: 16px 16px 120px; }
  .day { grid-template-columns: 1fr; gap: 10px; scroll-margin-top: 260px; }
  .day-label { position: static; flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .day-label .dnum { font-size: 2rem; }
  .day-label .dmeta, .day-label .dsum, .day-label .tag-today { margin-top: 0; }
  .posts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .post { transition: border-color .2s, box-shadow .2s, opacity .2s; }
}
</style>
</head>
<body>

<section class="setup" id="setup" hidden>
  <h1>SNS 편성표</h1>
  <p>이 브라우저에서 처음 한 번만 GitHub 열쇠(토큰)를 넣어주세요. 이 브라우저에만 저장됩니다.</p>
  <ol>
    <li><a class="link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 만들기</a> 열기</li>
    <li>Repository access: <b>Only select repositories</b> → threads-autopost, sns-desk</li>
    <li>Permissions → Repository → <b>Contents: Read and write</b></li>
    <li>Generate → 복사해서 아래에 붙여넣기</li>
  </ol>
  <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
  <button class="btn primary" id="save-token" type="button">시작하기</button>
  <div class="p-err" id="setup-err" hidden></div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><h1>SNS 편성표</h1><span class="range" id="range"></span></div>
      <div class="seg" id="seg" role="group" aria-label="상태로 보기"></div>
      <div class="tools"><div class="seg" id="view" role="group" aria-label="보기 방식"><button type="button" data-v="compact">요약</button><button type="button" data-v="full">글 전체</button></div><div class="accts" id="accts" role="group" aria-label="계정으로 보기"></div><button class="ghost" id="reload" type="button">새로고침</button></div>
      <nav class="week" id="week" aria-label="날짜로 이동"></nav>
    </div>
  </header>
  <main id="board"><div class="loading">불러오는 중…</div></main>
  <div class="bar" id="bar" hidden></div>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const OWNER = "hyeboa";
const POSTS_REPO = "threads-autopost";
const MEDIA_REPO = "sns-desk";
const MEDIA_BASE = `https://raw.githubusercontent.com/${OWNER}/${MEDIA_REPO}/main/`;
const ACCOUNTS = { lantern: "연등앱", helloaji: "헬로아지", chloe: "개인" };
const CHANNELS = { threads: "쓰레드", instagram: "인스타" };
const ICON = {
  threads: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16.5 11.2c-.3-2.6-2-4-4.4-4-2.6 0-4.2 1.8-4.2 4.8 0 3.2 1.8 5 4.6 5 2.2 0 3.8-1.3 3.8-3.2 0-2.2-2.2-2.9-4.4-2.6-1.6.2-2.6 1-2.5 2.1.1 1.1 1.2 1.7 2.5 1.6 2.6-.2 3.2-2.6 3.2-5.2"/><path d="M19 8.5C17.6 5 15 3.5 12 3.5 7 3.5 4 7 4 12s3 8.5 8 8.5c3.5 0 6.4-1.8 7-5"/></svg>`,
  instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>`,
};
const HOLE = /\[[^\]\n]{1,40}\]/g;
const LIMIT = { threads: 500, instagram: 2200 };
const MAX_IMG = { threads: 20, instagram: 10 };
const kst = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d);
const TODAY = kst(new Date());
const FROM = kst(new Date(Date.now() - 3 * 864e5));

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let TOKEN = store.get("gh_token") || "";
let VIEW = store.get("view") === "full" ? "full" : "compact";
const state = { posts: [], status: "all", account: "all", selected: new Set(), editing: null, busy: {}, thumbs: {}, saving: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = (id) => state.posts.find((p) => p.id === id);
function toast(msg, ms = 3000) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms); }

// ---------- GitHub ----------
async function api(method, path, body) {
  const res = await fetch(`https://api.github.com${path}`, {
    method,
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  if (!res.ok) { const e = new Error(`${res.status}`); e.status = res.status; e.text = await res.text(); throw e; }
  return res.status === 204 ? null : res.json();
}
const repo = (r = POSTS_REPO) => `/repos/${OWNER}/${r}`;
const unb64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
async function gitSha(text) {
  const body = new TextEncoder().encode(text);
  const head = new TextEncoder().encode(`blob ${body.length}\0`);
  const all = new Uint8Array(head.length + body.length); all.set(head); all.set(body, head.length);
  return [...new Uint8Array(await crypto.subtle.digest("SHA-1", all))].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const plain = ({ _path, _sha, ...data }) => data;

async function loadPosts() {
  const tree = await api("GET", `${repo()}/git/trees/main?recursive=1`);
  const files = tree.tree.filter((t) => t.type === "blob" && /^posts\/\d{4}-\d{2}-\d{2}\/.+\.json$/.test(t.path) && t.path.slice(6, 16) >= FROM);
  const out = [], queue = [...files];
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try { const b = await api("GET", `${repo()}/git/blobs/${f.sha}`); out.push({ ...JSON.parse(unb64(b.content)), _path: f.path, _sha: f.sha }); }
      catch (e) { console.warn("읽기 실패", f.path, e); }
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  return out;
}

// 여러 글을 커밋 하나로 저장한다. 그 사이 게시 봇이 바꾼 파일은 최신본 위에 변경만 덧입히고, 이미 게시된 글은 건드리지 않는다.
async function commitPosts(changes, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const ref = await api("GET", `${repo()}/git/ref/heads/main`);
    const head = ref.object.sha;
    const commit = await api("GET", `${repo()}/git/commits/${head}`);
    const tree = await api("GET", `${repo()}/git/trees/${commit.tree.sha}?recursive=1`);
    const shaOf = Object.fromEntries(tree.tree.map((t) => [t.path, t.sha]));
    const entries = [], applied = [];
    let skipped = 0;
    for (const { p, patch } of changes) {
      let base = plain(p);
      const cur = shaOf[p._path];
      if (cur && cur !== p._sha) { const b = await api("GET", `${repo()}/git/blobs/${cur}`); base = JSON.parse(unb64(b.content)); }
      if (base.status === "posted") { Object.assign(p, base, { _sha: cur }); skipped++; continue; }
      const text = JSON.stringify({ ...base, ...patch }, null, 2) + "\n";
      entries.push({ path: p._path, mode: "100644", type: "blob", content: text });
      applied.push({ p, next: { ...base, ...patch }, text });
    }
    if (!entries.length) return { saved: 0, skipped };
    const nt = await api("POST", `${repo()}/git/trees`, { base_tree: commit.tree.sha, tree: entries });
    const nc = await api("POST", `${repo()}/git/commits`, { message, tree: nt.sha, parents: [head] });
    try { await api("PATCH", `${repo()}/git/refs/heads/main`, { sha: nc.sha }); }
    catch (e) { if (e.status === 422 && attempt < 2) continue; throw e; }
    for (const a of applied) { Object.assign(a.p, a.next); a.p._sha = await gitSha(a.text); }
    return { saved: applied.length, skipped };
  }
  throw new Error("저장 충돌");
}

// 사진: 긴 변 1440px JPEG로 줄여서 sns-desk/media 에 올린다 (인스타는 JPEG만 받음)
async function toJpeg(file) {
  const bmp = await createImageBitmap(file).catch(async () => { const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); return img; });
  const scale = Math.min(1, 1440 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
  return new Promise((r) => c.toBlob(r, "image/jpeg", 0.88));
}
async function uploadPhoto(post, file) {
  const blob = await toJpeg(file);
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  const path = `media/${post.date}/${post.id}-${Date.now().toString(36)}.jpg`;
  await api("PUT", `${repo(MEDIA_REPO)}/contents/${path}`, { message: `사진 추가: ${post.id}`, content: btoa(bin) });
  return { url: MEDIA_BASE + path, local: URL.createObjectURL(blob) };
}

// ---------- 판단 ----------
const editable = (p) => ["draft", "failed", "rejected"].includes(p.status);
function issues(p) {
  const out = [];
  if (!(p.images || []).length) out.push("사진 필요");
  const h = (p.text || "").match(HOLE) || [];
  if (h.length) out.push(`빈칸 ${h.length}곳 채우기`);
  const n = [...(p.text || "")].length;
  if (!n) out.push("본문 없음");
  if (n > LIMIT[p.channel]) out.push(`${n - LIMIT[p.channel]}자 초과`);
  return out;
}
const ready = (p) => (p.status === "draft" || p.status === "failed") && !issues(p).length;
const weekday = (d) => ["일", "월", "화", "수", "목", "금", "토"][new Date(d + "T12:00:00+09:00").getUTCDay()];
const md = (d) => { const [, m, dd] = d.split("-"); return `${+m}월 ${+dd}일`; };
const inAcct = (p) => state.account === "all" || p.account === state.account;
function inStatus(p) {
  if (state.status === "all") return true;
  if (state.status === "issue") return p.status === "failed" || p.status === "rejected";
  return p.status === state.status;
}

// ---------- 그리기 ----------
function textHtml(t) { return esc(t).replace(/\[[^\]\n]{1,40}\]/g, (m) => `<mark>${m}</mark>`); }
function mediaHtml(p) {
  const imgs = p.images || [], can = editable(p), busy = state.busy[p.id];
  const src = (u) => esc(state.thumbs[u] || u);
  let html;
  if (!imgs.length) {
    html = can
      ? `<button type="button" class="drop" data-act="pick"><strong>사진 올리기</strong><span>끌어놓거나 눌러서 선택</span>${p.imageHint ? `<em><span>추천: ${esc(p.imageHint)}</span></em>` : ""}</button>`
      : `<div class="drop"><span>사진 없음</span></div>`;
  } else {
    html = `<img class="main" src="${src(imgs[0])}" alt="${esc(p.title || "")} 대표 사진" loading="lazy">`;
    if (imgs.length > 1 || can) {
      html += `<div class="strip">${imgs.map((u, i) => `<span class="th"><img src="${src(u)}" alt="사진 ${i + 1}" loading="lazy">${can ? `<button type="button" class="x" data-act="rm" data-i="${i}" aria-label="사진 ${i + 1} 빼기">×</button>` : ""}</span>`).join("")}${can && imgs.length < MAX_IMG[p.channel] ? `<button type="button" class="th add" data-act="pick" aria-label="사진 추가">+</button>` : ""}</div>`;
    }
  }
  return `<div class="media" data-drop="${can ? 1 : 0}">${html}${busy ? `<div class="busy">${esc(busy)}</div>` : ""}</div>`;
}
function footHtml(p) {
  const n = [...(p.text || "")].length;
  if (p.status === "approved") {
    return `<span class="okline good">${md(p.date)} ${esc(p.slot)} 자동 게시</span><button type="button" class="btn quiet" data-act="unapprove">승인 취소</button>`;
  }
  if (p.status === "posted") {
    return `<span class="badge posted">게시됨</span><span class="okline"></span>${p.permalink ? `<a class="link" href="${esc(p.permalink)}" target="_blank" rel="noopener">게시물 보기</a>` : ""}`;
  }
  if (p.status === "rejected") {
    return `<span class="badge rejected">보류</span><span class="okline"></span><button type="button" class="btn" data-act="restore">다시 대기로</button>`;
  }
  const is = issues(p);
  const left = is.length ? `<span class="issues">${is.join(" · ")}</span>` : `<span class="okline ${n > LIMIT[p.channel] ? "over" : ""}">${n} / ${LIMIT[p.channel]}자</span>`;
  return `${left}<button type="button" class="btn quiet" data-act="hold">보류</button><button type="button" class="btn primary approve" data-act="approve" ${is.length ? "disabled" : ""}>${p.status === "failed" ? "다시 승인" : "승인"}</button>`;
}
function cardHtml(p) {
  const can = editable(p), sel = state.selected.has(p.id), editing = state.editing === p.id;
  return `
  <article class="post acc-${p.account} st-${p.status}${sel ? " is-selected" : ""}" data-id="${esc(p.id)}">
    <div class="p-head">
      ${(p.status === "draft" || p.status === "failed") ? `<label class="sel"><input type="checkbox" data-act="sel" ${sel ? "checked" : ""} ${ready(p) ? "" : "disabled"} aria-label="${esc(p.title)} 선택"></label>` : ""}
      <span class="who">${ACCOUNTS[p.account]}</span>
      <span class="ch">${ICON[p.channel]}${CHANNELS[p.channel]}</span>
      <input class="slot" type="text" inputmode="numeric" maxlength="5" value="${esc(p.slot)}" data-act="slot" ${can ? "" : "disabled"} aria-label="게시 시간 (24시간, 예: 18:30)" title="${can ? "눌러서 시간 바꾸기" : ""}">
    </div>
    ${mediaHtml(p)}
    <div class="p-body">
      <h3 class="p-title">${esc(p.title || (p.text || "").split("\n")[0])}</h3>
      ${editing
        ? `<textarea class="p-edit" data-act="text" aria-label="본문">${esc(p.text || "")}</textarea>`
        : `<div class="p-text${can ? " can-edit" : ""}" ${can ? `data-act="edit" tabindex="0" title="눌러서 전체 보기·수정"` : ""}>${textHtml(p.text || "")}</div>`}
      ${p.error && p.status === "failed" ? `<div class="p-err">실패 이유: ${esc(p.error)}</div>` : ""}
    </div>
    <div class="p-foot">${footHtml(p)}</div>
  </article>`;
}
function visible() {
  return state.posts.filter((p) => inAcct(p) && inStatus(p))
    .sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot) || a.channel.localeCompare(b.channel) || a.account.localeCompare(b.account));
}
function applyView() {
  document.body.classList.toggle("compact", VIEW === "compact");
  $("view").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === VIEW)));
}
$("view").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; VIEW = b.dataset.v; store.set("view", VIEW); applyView(); };
applyView();
function renderTop() {
  const scoped = state.posts.filter(inAcct);
  const c = (f) => scoped.filter(f).length;
  const segs = [["all", "전체", scoped.length], ["draft", "승인 대기", c((p) => p.status === "draft")], ["approved", "승인됨", c((p) => p.status === "approved")], ["posted", "게시됨", c((p) => p.status === "posted")], ["issue", "실패·보류", c((p) => p.status === "failed" || p.status === "rejected")]];
  $("seg").innerHTML = segs.map(([k, l, n]) => `<button type="button" data-s="${k}" aria-pressed="${state.status === k}">${l}<b>${n}</b></button>`).join("");
  $("accts").innerHTML = [["all", "전체 계정"], ...Object.entries(ACCOUNTS)].map(([k, l]) => `<button type="button" class="acct-f" data-a="${k}" aria-pressed="${state.account === k}">${k === "all" ? "" : "<i></i>"}${l}</button>`).join("");
  const dates = [...new Set(state.posts.map((p) => p.date))].sort();
  $("range").textContent = dates.length ? `${md(dates[0])} – ${md(dates[dates.length - 1])}` : "";
  $("week").innerHTML = dates.map((d) => {
    const ps = scoped.filter((p) => p.date === d);
    const todo = ps.filter((p) => p.status === "draft").length;
    return `<button type="button" class="wd${d === TODAY ? " today" : ""}" data-d="${d}"><span class="n">${+d.slice(8)}</span><span class="w">${weekday(d)}요일</span><span class="c ${todo ? "todo" : "done"}">${todo ? `대기 ${todo}` : ps.length ? "승인 완료" : "글 없음"}</span></button>`;
  }).join("");
}
function renderBar() {
  const pool = state.posts.filter((p) => inAcct(p) && ready(p));
  const sel = [...state.selected].map(byId).filter((p) => p && ready(p));
  state.selected = new Set(sel.map((p) => p.id));
  const bar = $("bar");
  if (!pool.length && !sel.length) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = sel.length
    ? `<span class="msg"><b>${sel.length}개</b> 선택됨 · 승인하면 각자 정해진 날짜·시간에 올라갑니다</span>
       <button type="button" class="btn light" data-bar="clear">선택 해제</button>
       <button type="button" class="btn go" data-bar="approve" ${state.saving ? "disabled" : ""}>${sel.length}개 승인</button>`
    : `<span class="msg">사진·본문이 준비된 글 <b>${pool.length}개</b></span>
       <button type="button" class="btn go" data-bar="all">모두 선택</button>`;
}
function render() {
  renderTop();
  const list = visible();
  if (!list.length) {
    $("board").innerHTML = state.posts.length
      ? `<div class="empty"><strong>이 조건에 맞는 글이 없어요</strong>위에서 다른 상태나 계정을 골라보세요.</div>`
      : `<div class="empty"><strong>이번 주 글이 아직 없어요</strong>매주 일요일 저녁에 다음 7일치 글이 채워집니다.</div>`;
    renderBar(); return;
  }
  const byDay = {};
  for (const p of list) (byDay[p.date] ||= []).push(p);
  $("board").innerHTML = Object.entries(byDay).map(([d, ps]) => {
    const todo = ps.filter((p) => p.status === "draft").length, ok = ps.filter((p) => p.status === "approved" || p.status === "posted").length;
    return `<section class="day" id="d-${d}">
      <div class="day-label"><span class="dnum">${+d.slice(8)}</span><span class="dmeta">${+d.slice(5, 7)}월 · ${weekday(d)}요일</span>${d === TODAY ? `<span class="tag-today">오늘</span>` : ""}<span class="dsum">${ps.length}개 글${todo ? ` · 대기 ${todo}` : ""}${ok ? ` · 승인 ${ok}` : ""}</span></div>
      <div class="posts">${ps.map(cardHtml).join("")}</div>
    </section>`;
  }).join("");
  renderBar();
}
function redraw(id) {
  const el = document.querySelector(`.post[data-id="${CSS.escape(id)}"]`);
  const p = byId(id);
  if (el && p) el.outerHTML = cardHtml(p);
  renderTop(); renderBar();
  if (state.editing === id) {
    const ta = document.querySelector(`.post[data-id="${CSS.escape(id)}"] .p-edit`);
    if (ta) { fit(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}
const fit = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };

// ---------- 동작 ----------
async function save(p, patch, message, okMsg) {
  try {
    const r = await commitPosts([{ p, patch }], message);
    if (r.skipped) toast("이미 게시된 글이라 바꾸지 않았어요");
    else if (okMsg) toast(okMsg);
  } catch (e) { console.error(e); toast("저장하지 못했어요. 새로고침 후 다시 해주세요."); }
  redraw(p.id);
}
async function approveMany(ps) {
  if (!ps.length) return;
  state.saving = true; renderBar();
  const now = new Date().toISOString();
  try {
    const r = await commitPosts(ps.map((p) => ({ p, patch: { status: "approved", error: "", attempts: 0, approvedAt: now } })), `승인 ${ps.length}개`);
    state.selected.clear();
    toast(`${r.saved}개 승인했어요. 정해진 시간에 자동으로 올라갑니다.${r.skipped ? ` (${r.skipped}개는 이미 게시됨)` : ""}`, 4000);
  } catch (e) { console.error(e); toast("승인하지 못했어요. 새로고침 후 다시 해주세요."); }
  state.saving = false; render();
}
async function addPhotos(p, files) {
  files = files.filter((f) => f.type.startsWith("image/")).slice(0, MAX_IMG[p.channel] - (p.images || []).length);
  if (!files.length) return;
  const added = [];
  for (let i = 0; i < files.length; i++) {
    state.busy[p.id] = `사진 올리는 중 ${i + 1}/${files.length}`; redraw(p.id);
    try { const r = await uploadPhoto(p, files[i]); state.thumbs[r.url] = r.local; added.push(r.url); }
    catch (e) { console.error(e); toast("사진 하나를 올리지 못했어요"); }
  }
  delete state.busy[p.id];
  if (added.length) await save(p, { images: [...(p.images || []), ...added] }, `사진 추가: ${p.id}`, `사진 ${added.length}장 올렸어요`);
  else redraw(p.id);
}
let pickFor = null;
$("file").onchange = () => { const p = byId(pickFor); if (p) addPhotos(p, [...$("file").files]); pickFor = null; };

const board = $("board");
board.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const card = t.closest(".post"); const p = card && byId(card.dataset.id); if (!p) return;
  const act = t.dataset.act;
  if (act === "pick") { pickFor = p.id; $("file").value = ""; $("file").click(); }
  else if (act === "rm") { const imgs = [...p.images]; imgs.splice(+t.dataset.i, 1); save(p, { images: imgs }, `사진 빼기: ${p.id}`); }
  else if (act === "edit") { state.editing = p.id; redraw(p.id); }
  else if (act === "approve") { if (!issues(p).length) approveMany([p]); }
  else if (act === "unapprove") save(p, { status: "draft" }, `승인 취소: ${p.id}`, "승인을 취소했어요");
  else if (act === "hold") { state.selected.delete(p.id); save(p, { status: "rejected" }, `보류: ${p.id}`, "보류했어요. 게시되지 않습니다."); }
  else if (act === "restore") save(p, { status: "draft" }, `대기로: ${p.id}`);
});
board.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset?.act === "edit" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); }
  if (t.dataset?.act === "text" && e.key === "Escape") t.blur();
  if (t.dataset?.act === "slot" && e.key === "Enter") t.blur();
});
board.addEventListener("change", (e) => {
  const t = e.target; const card = t.closest(".post"); const p = card && byId(card.dataset.id); if (!p) return;
  if (t.dataset.act === "sel") { t.checked ? state.selected.add(p.id) : state.selected.delete(p.id); card.classList.toggle("is-selected", t.checked); renderBar(); }
  if (t.dataset.act === "slot") {
    const v = t.value.trim().replace(/^(\d):/, "0$1:").replace(/^(\d{2})(\d{2})$/, "$1:$2");
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) { t.value = p.slot; toast("시간은 18:30처럼 24시간으로 적어주세요"); return; }
    t.value = v;
    if (v !== p.slot) save(p, { slot: v }, `시간 변경: ${p.id}`, `${md(p.date)} ${v}로 바꿨어요`);
  }
});
board.addEventListener("input", (e) => {
  const t = e.target; if (t.dataset.act !== "text") return;
  fit(t);
  const p = byId(t.closest(".post").dataset.id);
  const foot = t.closest(".post").querySelector(".p-foot");
  foot.innerHTML = footHtml({ ...p, text: t.value });
});
board.addEventListener("focusout", (e) => {
  const t = e.target; if (t.dataset.act !== "text") return;
  const p = byId(t.closest(".post").dataset.id);
  state.editing = null;
  if (t.value !== p.text) save(p, { text: t.value }, `본문 수정: ${p.id}`, "본문을 저장했어요");
  else redraw(p.id);
});
// 끌어놓기
board.addEventListener("dragover", (e) => { const m = e.target.closest('.media[data-drop="1"]'); if (!m) return; e.preventDefault(); m.classList.add("dragging"); });
board.addEventListener("dragleave", (e) => { const m = e.target.closest(".media"); if (m && !m.contains(e.relatedTarget)) m.classList.remove("dragging"); });
board.addEventListener("drop", (e) => {
  const m = e.target.closest('.media[data-drop="1"]'); if (!m) return;
  e.preventDefault(); m.classList.remove("dragging");
  const p = byId(m.closest(".post").dataset.id); if (p) addPhotos(p, [...e.dataTransfer.files]);

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

$("seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { state.status = b.dataset.s; render(); } };
$("accts").onclick = (e) => { const b = e.target.closest("button"); if (b) { state.account = b.dataset.a; render(); } };
$("week").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  let el = $("d-" + b.dataset.d);
  if (!el) { state.status = "all"; render(); el = $("d-" + b.dataset.d); }
  el?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
};
$("bar").onclick = (e) => {
  const b = e.target.closest("[data-bar]"); if (!b) return;
  if (b.dataset.bar === "all") { state.posts.filter((p) => inAcct(p) && ready(p)).forEach((p) => state.selected.add(p.id)); render(); }
  if (b.dataset.bar === "clear") { state.selected.clear(); render(); }
  if (b.dataset.bar === "approve") approveMany([...state.selected].map(byId).filter((p) => p && ready(p)));
};

async function boot() {
  if (!TOKEN) { $("setup").hidden = false; $("app").hidden = true; return; }
  $("setup").hidden = true; $("app").hidden = false;
  $("board").innerHTML = `<div class="loading">불러오는 중…</div>`;
  try { state.posts = await loadPosts(); state.selected.clear(); render(); }
  catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) {
      store.del("gh_token"); TOKEN = "";
      $("setup").hidden = false; $("app").hidden = true;
      $("setup-err").hidden = false; $("setup-err").textContent = "이 토큰으로는 저장소를 열 수 없어요. 저장소 2개 선택과 Contents 읽기/쓰기 권한을 확인해 주세요.";
    } else $("board").innerHTML = `<div class="empty"><strong>불러오지 못했어요</strong>인터넷 연결을 확인하고 새로고침을 눌러주세요.</div>`;
  }
}
$("save-token").onclick = () => { const v = $("token").value.trim(); if (!v) return; TOKEN = v; store.set("gh_token", v); $("setup-err").hidden = true; boot(); };
$("token").onkeydown = (e) => { if (e.key === "Enter") $("save-token").click(); };
$("reload").onclick = boot;
boot();
</script>
</body>
</html>
