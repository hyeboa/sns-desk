<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SNS 승인함">
<meta name="theme-color" content="#f3f4f6">
<title>SNS 승인함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 날짜별 목록(제목+사진 썸네일) → 탭하면 상세 시트. 상세에서 승인하면 다음 대기 글로 넘어감 */
:root {
  --bg: #f3f4f6; --surface: #fff; --sunken: #eceef2; --ink: #171a21; --muted: #5d6573; --line: #dde1e7;
  --focus: #2f5fd0; --btn: #171a21; --btn-ink: #fff;
  --lantern: #b0285c; --lantern-soft: #fbe9f0;
  --helloaji: #1d7356; --helloaji-soft: #e3f3ec;
  --chloe: #40507a; --chloe-soft: #e8ecf6;
  --ok: #1f7a3d; --ok-soft: #e2f4e7; --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fde7e5;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --surface: #1a1d24; --sunken: #232731; --ink: #eceef3; --muted: #9aa3b2; --line: #2d323d;
    --focus: #7aa2ff; --btn: #eceef3; --btn-ink: #111318;
    --lantern: #f07aa5; --lantern-soft: #3a1d29; --helloaji: #5ccb9f; --helloaji-soft: #17322a; --chloe: #9fb0e0; --chloe-soft: #232b40;
    --ok: #6fd18d; --ok-soft: #173123; --warn: #f0b85a; --warn-soft: #3a2c12; --bad: #ff8a80; --bad-soft: #3d1c1a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
h1 { font-size: 1.3rem; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .85rem; }
.stats { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.stats::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-family: var(--f-mono); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.filters { display: flex; gap: 4px; padding-bottom: 10px; flex-wrap: wrap; }
.ftab { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: .86rem; color: var(--muted); }
.ftab[aria-pressed="true"] { background: var(--sunken); color: var(--ink); font-weight: 600; }

main { padding-block: 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
.day { margin-bottom: 20px; }
.day h2 { font-size: .9rem; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.day h2 .today { color: var(--focus); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 66px 1fr 64px; gap: 12px; align-items: center; padding: 12px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:active { background: var(--sunken); }
.time { font-family: var(--f-mono); font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.mid { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .75rem; }
.acct { font-weight: 600; padding: 1px 7px; border-radius: 5px; }
.acct.lantern { color: var(--lantern); background: var(--lantern-soft); }
.acct.helloaji { color: var(--helloaji); background: var(--helloaji-soft); }
.acct.chloe { color: var(--chloe); background: var(--chloe-soft); }
.ch { color: var(--muted); }
.title { font-weight: 600; font-size: .98rem; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.preview { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--sunken); object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.2; position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .n { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: .68rem; border-radius: 4px; padding: 0 4px; }
.pill { font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.s-draft { color: var(--warn); background: var(--warn-soft); }
.s-approved { color: var(--ok); background: var(--ok-soft); }
.s-posted { color: var(--btn-ink); background: var(--ok); }
.s-failed { color: var(--bad); background: var(--bad-soft); }
.s-rejected { color: var(--muted); background: var(--sunken); }

.empty { text-align: center; color: var(--muted); padding: 56px 12px; display: flex; flex-direction: column; gap: 6px; }
.empty strong { color: var(--ink); font-size: 1.05rem; }

/* 상세 시트 */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.sheet-head .spacer { flex: 1; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-inner { max-width: 720px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.d-title { font-size: 1.25rem; font-weight: 700; line-height: 1.35; margin: 0; letter-spacing: -0.01em; }
.d-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.d-meta input[type=time] { font-family: var(--f-mono); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--sunken); max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1rem; line-height: 1; }
.photo .busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; }
.add-photo { aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: .85rem; }
.add-photo b { font-size: 1.6rem; font-weight: 400; line-height: 1; }
.hint { font-size: .85rem; background: var(--sunken); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
.hint b { color: var(--ink); }
label.lbl { font-size: .8rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
textarea { width: 100%; min-height: 12em; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); line-height: 1.65; font-size: 15px; }
textarea:read-only { background: var(--sunken); border-color: transparent; }
.count { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); text-align: right; margin-top: 4px; }
.count.over { color: var(--bad); font-weight: 600; }
.warn { font-size: .85rem; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; }
.err { font-size: .85rem; color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
.sheet-foot { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.foot-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; font-weight: 600; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); flex: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.quiet { border-color: transparent; color: var(--muted); background: transparent; }
a.link { color: var(--focus); }

.setup { max-width: 480px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.setup input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-family: var(--f-mono); font-size: 14px; }
.setup ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 10px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 40; }
.loading { text-align: center; color: var(--muted); padding: 40px; }
</style>
</head>
<body>

<section class="setup" id="setup" hidden>
  <h1>SNS 승인함</h1>
  <p>처음 한 번만 GitHub 열쇠(토큰)를 넣어주세요. 이 폰에만 저장됩니다.</p>
  <ol>
    <li><a class="link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 만들기</a> 열기</li>
    <li>Repository access: <b>Only select repositories</b> → threads-autopost, sns-desk</li>
    <li>Permissions → Repository → <b>Contents: Read and write</b></li>
    <li>Generate → 복사해서 아래에 붙여넣기</li>
  </ol>
  <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
  <button class="btn primary" id="save-token" type="button">시작하기</button>
  <div class="err" id="setup-err" hidden></div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="head">
        <h1>SNS 승인함</h1>
        <button class="icon-btn" id="reload" type="button">새로고침</button>
      </div>
      <div class="stats" id="stats" role="group" aria-label="상태"></div>
      <div class="filters" id="filters" role="group" aria-label="계정"></div>
    </div>
  </header>
  <main class="wrap" id="main"><div class="loading">불러오는 중…</div></main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="toast" id="toast" hidden></div>

<script>
const OWNER = "hyeboa";
const POSTS_REPO = "threads-autopost";
const MEDIA_REPO = "sns-desk";
const MEDIA_BASE = `https://raw.githubusercontent.com/${OWNER}/${MEDIA_REPO}/main/`;
const ACCOUNTS = { lantern: "연등앱", helloaji: "헬로아지", chloe: "개인" };
const CHANNELS = { threads: "쓰레드", instagram: "인스타" };
const STATUS = { draft: "승인 대기", approved: "승인됨", posted: "게시됨", failed: "실패", rejected: "보류" };
const HOLE = /\[[^\]\n]{1,40}\]/g;
const LIMIT = { threads: 500, instagram: 2200 };
const kst = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d);
const TODAY = kst(new Date());
const FROM = kst(new Date(Date.now() - 3 * 864e5));

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let TOKEN = store.get("gh_token") || "";
const state = { posts: [], status: "draft", account: "all", openId: null, localThumbs: {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, ms = 2800) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms); }

// ---------- GitHub API ----------
async function api(method, path, body) {
  const res = await fetch(`https://api.github.com${path}`, {
    method,
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  if (!res.ok) { const e = new Error(`${res.status}`); e.status = res.status; e.text = await res.text(); throw e; }
  return res.status === 204 ? null : res.json();
}
const b64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
const unb64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), (c) => c.charCodeAt(0)));

async function loadPosts() {
  const tree = await api("GET", `/repos/${OWNER}/${POSTS_REPO}/git/trees/main?recursive=1`);
  const files = tree.tree.filter((t) => t.type === "blob" && /^posts\/\d{4}-\d{2}-\d{2}\/.+\.json$/.test(t.path) && t.path.slice(6, 16) >= FROM);
  const out = [];
  const queue = [...files];
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const blob = await api("GET", `/repos/${OWNER}/${POSTS_REPO}/git/blobs/${f.sha}`);
        out.push({ ...JSON.parse(unb64(blob.content)), _path: f.path, _sha: f.sha });
      } catch (e) { console.warn("읽기 실패", f.path, e); }
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  return out;
}

async function savePost(p, patch, message) {
  const { _path, _sha, ...data } = p;
  const next = { ...data, ...patch };
  const body = JSON.stringify(next, null, 2) + "\n";
  try {
    const r = await api("PUT", `/repos/${OWNER}/${POSTS_REPO}/contents/${_path}`, { message, content: b64(body), sha: _sha });
    Object.assign(p, patch, { _sha: r.content.sha });
  } catch (e) {
    if (e.status === 409 || e.status === 422) {
      // 그 사이 게시 봇이 파일을 바꿨으면 최신을 받아 다시 적용
      const cur = await api("GET", `/repos/${OWNER}/${POSTS_REPO}/contents/${_path}`);
      const fresh = JSON.parse(unb64(cur.content));
      if (fresh.status === "posted") { Object.assign(p, fresh, { _sha: cur.sha }); throw new Error("이미 게시된 글이라 바꿀 수 없어요"); }
      const r = await api("PUT", `/repos/${OWNER}/${POSTS_REPO}/contents/${_path}`, { message, content: b64(JSON.stringify({ ...fresh, ...patch }, null, 2) + "\n"), sha: cur.sha });
      Object.assign(p, fresh, patch, { _sha: r.content.sha });
    } else throw e;
  }
}

// 사진: 긴 변 1440px JPEG로 줄여서 sns-desk/media 에 올린다 (인스타는 JPEG만 받음)
async function toJpeg(file) {
  const bmp = await createImageBitmap(file).catch(async () => {
    const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); return img;
  });
  const scale = Math.min(1, 1440 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.88));
  return blob;
}
async function uploadPhoto(post, file) {
  const blob = await toJpeg(file);
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  const path = `media/${post.date}/${post.id}-${Date.now().toString(36)}.jpg`;
  await api("PUT", `/repos/${OWNER}/${MEDIA_REPO}/contents/${path}`, { message: `사진 추가: ${post.id}`, content: btoa(bin) });
  return { url: MEDIA_BASE + path, local: URL.createObjectURL(blob) };
}

// ---------- 화면 ----------
function weekday(d) { return ["일", "월", "화", "수", "목", "금", "토"][new Date(d + "T12:00:00+09:00").getUTCDay()]; }
function dayLabel(d) { const [, m, dd] = d.split("-"); return `${+m}월 ${+dd}일 (${weekday(d)})`; }
function problems(p, text = p.text, images = p.images || []) {
  const out = [];
  if ((images || []).length === 0) out.push("사진을 1장 이상 올려주세요");
  const h = (text || "").match(HOLE) || [];
  if (h.length) out.push(`빈칸을 채워주세요: ${h.join(", ")}`);
  const n = [...(text || "")].length;
  if (!n) out.push("본문이 비어 있어요");
  if (n > LIMIT[p.channel]) out.push(`${n}자예요 (최대 ${LIMIT[p.channel]}자)`);
  return out;
}
function thumbHtml(p) {
  const imgs = p.images || [];
  if (!imgs.length) return `<span class="thumb">사진<br>필요</span>`;
  const src = state.localThumbs[imgs[0]] || imgs[0];
  return `<span class="thumb"><img src="${esc(src)}" alt="" loading="lazy">${imgs.length > 1 ? `<span class="n">+${imgs.length - 1}</span>` : ""}</span>`;
}
function filtered() {
  return state.posts.filter((p) => (state.status === "all" || p.status === state.status || (state.status === "posted" && p.status === "failed"))
    && (state.account === "all" || p.account === state.account));
}
function render() {
  const count = (s) => state.posts.filter((p) => p.status === s && (state.account === "all" || p.account === state.account)).length;
  const stats = [["draft", "승인 대기", count("draft")], ["approved", "승인됨", count("approved")], ["posted", "게시·실패", count("posted") + count("failed")], ["all", "전체", null]];
  $("stats").innerHTML = stats.map(([k, l, n]) => `<button type="button" class="chip" data-s="${k}" aria-pressed="${state.status === k}">${l}${n === null ? "" : ` <b>${n}</b>`}</button>`).join("");
  $("stats").querySelectorAll("button").forEach((b) => (b.onclick = () => { state.status = b.dataset.s; render(); }));
  $("filters").innerHTML = [["all", "전체 계정"], ...Object.entries(ACCOUNTS)].map(([k, l]) => `<button type="button" class="ftab" data-a="${k}" aria-pressed="${state.account === k}">${l}</button>`).join("");
  $("filters").querySelectorAll("button").forEach((b) => (b.onclick = () => { state.account = b.dataset.a; render(); }));

  const list = filtered().sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot) || a.channel.localeCompare(b.channel));
  if (!list.length) {
    $("main").innerHTML = state.status === "draft"
      ? `<div class="empty"><strong>승인할 글이 없어요</strong><span>매주 일요일 저녁에 다음 주 글이 채워집니다.</span></div>`
      : `<div class="empty"><strong>해당하는 글이 없어요</strong></div>`;
    return;
  }
  const byDay = {};
  for (const p of list) (byDay[p.date] ||= []).push(p);
  $("main").innerHTML = Object.entries(byDay).map(([d, ps]) => `
    <section class="day">
      <h2>${dayLabel(d)}${d === TODAY ? ` <span class="today">오늘</span>` : ""}</h2>
      <div class="list">${ps.map((p) => `
        <button type="button" class="row" data-id="${esc(p.id)}">
          <span class="time">${esc(p.slot)}<span class="pill s-${p.status}">${STATUS[p.status] || p.status}</span></span>
          <span class="mid">
            <span class="meta"><span class="acct ${p.account}">${ACCOUNTS[p.account]}</span><span class="ch">${CHANNELS[p.channel]}</span></span>
            <span class="title">${esc(p.title || (p.text || "").split("\n")[0])}</span>
            <span class="preview">${esc((p.text || "").replace(/\s+/g, " ").slice(0, 80))}</span>
          </span>
          ${thumbHtml(p)}
        </button>`).join("")}
      </div>
    </section>`).join("");
  $("main").querySelectorAll(".row").forEach((r) => (r.onclick = () => openSheet(r.dataset.id)));
}

function nextPendingAfter(id) {
  const list = state.posts.filter((p) => p.status === "draft" && (state.account === "all" || p.account === state.account))
    .sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot));
  return list.find((p) => p.id !== id) || null;
}

function openSheet(id) {
  const p = state.posts.find((x) => x.id === id);
  if (!p) return;
  state.openId = id;
  const editable = p.status === "draft" || p.status === "failed" || p.status === "rejected";
  let images = [...(p.images || [])];
  const s = $("sheet");
  s.innerHTML = `
    <div class="sheet-head">
      <button type="button" class="btn quiet" id="close">← 목록</button>
      <span class="spacer"></span>
      <span class="pill s-${p.status}">${STATUS[p.status]}</span>
    </div>
    <div class="sheet-body"><div class="sheet-inner">
      <div class="d-meta">
        <span class="acct ${p.account}">${ACCOUNTS[p.account]}</span>
        <span>${CHANNELS[p.channel]}</span>
        <span>·</span>
        <span>${dayLabel(p.date)}</span>
        <input type="time" id="d-time" value="${esc(p.slot)}" ${editable ? "" : "disabled"} aria-label="게시 시간">
      </div>
      <h2 class="d-title" id="d-title">${esc(p.title || "")}</h2>
      ${p.status === "posted" && p.permalink ? `<a class="link" href="${esc(p.permalink)}" target="_blank" rel="noopener">게시된 글 보기 →</a>` : ""}
      ${p.error && p.status !== "posted" ? `<div class="err">실패 이유: ${esc(p.error)}</div>` : ""}
      <div>
        <label class="lbl">사진 ${p.channel === "threads" ? "(최대 20장)" : "(최대 10장, 첫 장이 대표)"}</label>
        <div class="photos" id="photos"></div>
      </div>
      ${p.imageHint ? `<div class="hint"><b>추천 사진</b> · ${esc(p.imageHint)}</div>` : ""}
      <div>
        <label class="lbl" for="d-text">${p.channel === "threads" ? "본문" : "캡션"}</label>
        <textarea id="d-text" ${editable ? "" : "readonly"}>${esc(p.text || "")}</textarea>
        <div class="count" id="d-count"></div>
      </div>
      <div class="warn" id="d-warn" hidden></div>
    </div></div>
    <div class="sheet-foot"><div class="foot-inner" id="d-actions"></div></div>`;
  s.hidden = false;
  document.body.style.overflow = "hidden";
  $("close").onclick = closeSheet;

  const ta = $("d-text"), time = $("d-time");
  function refresh() {
    const n = [...ta.value].length;
    $("d-count").textContent = `${n} / ${LIMIT[p.channel]}`;
    $("d-count").className = "count" + (n > LIMIT[p.channel] ? " over" : "");
    const pr = problems(p, ta.value, images);
    $("d-warn").hidden = !(editable && pr.length);
    $("d-warn").textContent = pr.join(" · ");
    const ok = $("approve"); if (ok) ok.disabled = pr.length > 0;
  }
  function drawPhotos() {
    const max = p.channel === "threads" ? 20 : 10;
    $("photos").innerHTML = images.map((u, i) => `
      <div class="photo"><img src="${esc(state.localThumbs[u] || u)}" alt="사진 ${i + 1}">${editable ? `<button type="button" class="x" data-i="${i}" aria-label="사진 삭제">×</button>` : ""}</div>`).join("")
      + (editable && images.length < max ? `<button type="button" class="add-photo" id="add"><b>+</b>사진 추가</button>` : "");
    $("photos").querySelectorAll(".x").forEach((b) => (b.onclick = () => { images.splice(+b.dataset.i, 1); drawPhotos(); refresh(); }));
    const add = $("add"); if (add) add.onclick = () => { $("file").value = ""; $("file").click(); };
  }
  $("file").onchange = async () => {
    const files = [...$("file").files];
    for (const f of files) {
      const tmp = URL.createObjectURL(f);
      images.push(tmp); state.localThumbs[tmp] = tmp; drawPhotos();
      const box = $("photos").children[images.indexOf(tmp)];
      if (box) box.insertAdjacentHTML("beforeend", `<span class="busy">올리는 중…</span>`);
      try {
        const r = await uploadPhoto(p, f);
        state.localThumbs[r.url] = r.local;
        images[images.indexOf(tmp)] = r.url;
      } catch (e) {
        images.splice(images.indexOf(tmp), 1);
        toast("사진을 올리지 못했어요. 다시 시도해 주세요.");
      }
      drawPhotos(); refresh();
    }
    if (editable) savePost(p, { images }, `사진 변경: ${p.id}`).then(render).catch(() => toast("저장하지 못했어요"));
  };
  ta.oninput = refresh;
  let savedText = ta.value, savedTime = time.value;
  const autosave = () => {
    if (!editable || (ta.value === savedText && time.value === savedTime)) return;
    const t = ta.value, s2 = time.value;
    savePost(p, { text: t, slot: s2 }, `수정: ${p.id}`).then(() => { savedText = t; savedTime = s2; toast("저장했어요", 1200); }).catch(() => toast("저장하지 못했어요"));
  };
  ta.onblur = autosave; time.onchange = autosave;

  const act = $("d-actions");
  const button = (label, cls, fn, id) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn " + cls; b.textContent = label; if (id) b.id = id; b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { toast(e.message || "저장하지 못했어요"); } b.disabled = false; refresh(); }; act.appendChild(b); return b; };
  if (editable) {
    button("보류", "quiet", async () => {
      await savePost(p, { status: "rejected", text: ta.value, slot: time.value, images }, `보류: ${p.id}`);
      toast("보류했어요"); goNext(p.id);
    });
    button(p.status === "failed" ? "다시 승인" : "승인", "primary", async () => {
      await savePost(p, { status: "approved", text: ta.value, slot: time.value, images, error: "", attempts: 0, approvedAt: new Date().toISOString() }, `승인: ${p.id}`);
      const due = new Date(`${p.date}T${time.value}:00+09:00`) <= new Date();
      toast(due ? "승인했어요. 시간이 지나서 15분 안에 올라갑니다." : `승인했어요. ${dayLabel(p.date)} ${time.value}에 올라갑니다.`);
      goNext(p.id);
    }, "approve");
  } else if (p.status === "approved") {
    button("승인 취소", "", async () => { await savePost(p, { status: "draft" }, `승인 취소: ${p.id}`); toast("승인을 취소했어요"); openSheet(p.id); render(); });
    const note = document.createElement("span"); note.className = "count"; note.style.flex = "1"; note.textContent = "시간이 되면 자동으로 올라갑니다";
    act.prepend(note);
  } else {
    button("목록으로", "primary", async () => closeSheet());
  }
  drawPhotos(); refresh();
}
function goNext(id) {
  render();
  const n = nextPendingAfter(id);
  if (n) openSheet(n.id); else { closeSheet(); toast("승인할 글을 모두 확인했어요"); }
}
function closeSheet() { $("sheet").hidden = true; $("sheet").innerHTML = ""; document.body.style.overflow = ""; state.openId = null; render(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.openId) closeSheet(); });

async function boot() {
  if (!TOKEN) { $("setup").hidden = false; $("app").hidden = true; return; }
  $("setup").hidden = true; $("app").hidden = false;
  $("main").innerHTML = `<div class="loading">불러오는 중…</div>`;
  try {
    state.posts = await loadPosts();
    render();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) {
      store.del("gh_token"); TOKEN = "";
      $("setup").hidden = false; $("app").hidden = true;
      $("setup-err").hidden = false; $("setup-err").textContent = "토큰으로 저장소를 열 수 없어요. 저장소 2개 선택과 Contents 읽기/쓰기 권한을 확인해 주세요.";
    } else {
      $("main").innerHTML = `<div class="empty"><strong>불러오지 못했어요</strong><span>인터넷 연결을 확인하고 새로고침을 눌러주세요.</span></div>`;
    }
  }
}
$("save-token").onclick = () => { const v = $("token").value.trim(); if (!v) return; TOKEN = v; store.set("gh_token", v); $("setup-err").hidden = true; boot(); };
$("reload").onclick = boot;
boot();
</script>
</body>
</html>
